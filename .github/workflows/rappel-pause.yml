name: Rappel de pause

on:
  push:
    paths:
      - "rappel-pause/**"
      - ".github/workflows/rappel-pause.yml"
  pull_request:
    paths:
      - "rappel-pause/**"
      - ".github/workflows/rappel-pause.yml"
  workflow_dispatch:
    inputs:
      publier_release:
        description: "Publier RappelPause.exe dans une pré-release GitHub"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.x"]
        include:
          # Version minimale prise en charge.
          - os: ubuntu-22.04
            python: "3.8"
          - os: windows-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests unitaires et d'intégration
        env:
          RAPPEL_PAUSE_TESTS_INTEGRATION: "1"
        run: python -m unittest discover -s rappel-pause/tests -v

  executable-windows:
    name: Exécutable Windows autonome
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Construction avec PyInstaller
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --onefile --noconsole --name RappelPause rappel-pause/rappel_pause.py
      - name: Installation, double-clic et désinstallation réels
        shell: pwsh
        run: |
          $telecharge = (Resolve-Path "dist\RappelPause.exe").Path
          $dossier = Join-Path $env:LOCALAPPDATA "RappelPause"
          $installe = Join-Path $dossier "RappelPause.exe"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $applications = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RappelPause"
          function Demarrer([string]$programme, [string]$arguments) {
            $options = @{ FilePath = $programme; PassThru = $true }
            if ($arguments) { $options.ArgumentList = $arguments }
            $p = Start-Process @options
            $null = $p.Handle  # nécessaire pour lire ExitCode ensuite
            return $p
          }
          function Lancer([string]$programme, [string]$arguments) {
            # WaitForExit n'attend que ce processus, pas le rappel qu'il laisse tourner.
            $p = Demarrer $programme $arguments
            if (-not $p.WaitForExit(120000)) { throw "$programme $arguments : ne se termine pas" }
            if ($p.ExitCode -ne 0) { throw "$programme $arguments : code $($p.ExitCode)" }
          }

          Lancer $telecharge "--version"
          Lancer $telecharge "--installer --silencieux"
          Lancer $telecharge "--installer --intervalle 90 --silencieux"
          if (-not (Test-Path $installe)) { throw "exécutable non installé" }
          $commande = (Get-ItemProperty $run).RappelPause
          if ($commande -notlike "*\RappelPause\RappelPause.exe*") { throw "lancement automatique incorrect : $commande" }
          $config = Get-Content (Join-Path $dossier "config.json") -Raw | ConvertFrom-Json
          if ($config.intervalle_minutes -ne 90) { throw "configuration incorrecte" }
          if (-not (Get-Process -Name RappelPause -ErrorAction SilentlyContinue)) { throw "rappel non démarré" }
          $entree = Get-ItemProperty $applications
          if ($entree.DisplayName -ne "Rappel de pause active") { throw "entrée de Paramètres > Applications absente" }
          if ($entree.UninstallString -notlike "*\RappelPause\RappelPause.exe*--desinstaller") {
            throw "commande de désinstallation incorrecte : $($entree.UninstallString)"
          }

          # Copie installée lancée sans argument (ouverture de session) : boucle de rappels, qui
          # s'arrête aussitôt puisqu'une instance tourne déjà. Aucune question ne doit être posée.
          Lancer $installe ""

          # Double-clic sur le fichier téléchargé : il doit attendre la réponse à « Installer ? ».
          # (S'il lançait la boucle de rappels, il s'arrêterait aussitôt : le verrou est pris.)
          $p = Demarrer $telecharge ""
          if ($p.WaitForExit(8000)) { throw "le double-clic n'a pas demandé de confirmation (code $($p.ExitCode))" }
          Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Stop-Process -Id $p.Id -Force

          # Bouton Désinstaller de Paramètres > Applications : c'est la copie installée qui s'exécute.
          Lancer $installe "--desinstaller --silencieux"
          if (Test-Path $applications) { throw "entrée de Paramètres > Applications non supprimée" }
          if ($null -ne (Get-ItemProperty $run).RappelPause) { throw "lancement automatique non supprimé" }
          $limite = (Get-Date).AddSeconds(60)
          while ((Test-Path $dossier) -and ((Get-Date) -lt $limite)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dossier) { throw "dossier non supprimé après la désinstallation" }
          if (Get-Process -Name RappelPause -ErrorAction SilentlyContinue) { throw "processus RappelPause restant" }
      - uses: actions/upload-artifact@v4
        with:
          name: RappelPause-windows
          path: dist/RappelPause.exe
          if-no-files-found: error

  publier-release:
    name: Publication de la pré-release
    needs: executable-windows
    # Uniquement sur déclenchement manuel explicite, jamais à chaque push.
    if: github.event_name == 'workflow_dispatch' && inputs.publier_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # seul ce job peut créer la release et son tag
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: RappelPause-windows
          path: dist
      - name: Création ou mise à jour de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 rappel-pause/rappel_pause.py --version | cut -d' ' -f2)
          tag="v${version}"
          empreinte=$(sha256sum dist/RappelPause.exe | cut -d' ' -f1)
          notes="Version de test de RappelPause.exe (Windows 10/11, sans Python) : double-cliquer sur le fichier puis répondre Oui pour l'installer. Désinstallation : Paramètres > Applications. Documentation : rappel-pause/README.md.

          SHA-256 de RappelPause.exe : ${empreinte}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/RappelPause.exe --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/RappelPause.exe --target "$GITHUB_SHA" --prerelease \
              --title "Rappel de pause active ${version}" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
          echo "Release ${tag} : SHA-256 ${empreinte}"
